name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-and-release:
    name: Build & Release APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            mkdir -p "${{ runner.temp }}"
            echo "$KEYSTORE_BASE64" | base64 -d > "${{ runner.temp }}/release.jks"
          fi

      - name: Build Release APK
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Compute Checksum
        run: |
          if [ -f "app/build/outputs/apk/release/lumina-player.apk" ]; then
            cd app/build/outputs/apk/release
            sha256sum lumina-player.apk > lumina-player.apk.sha256
            echo "Calculated SHA-256 Checksum:"
            cat lumina-player.apk.sha256
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: |
            app/build/outputs/apk/release/lumina-player.apk
            app/build/outputs/apk/release/lumina-player.apk.sha256
          name: Lumina Player ${{ github.ref_name }}
          generate_release_notes: true
          draft: false
          prerelease: false

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: lumina-player-release
          path: |
            app/build/outputs/apk/release/lumina-player.apk
            app/build/outputs/apk/release/lumina-player.apk.sha256
          retention-days: 30
