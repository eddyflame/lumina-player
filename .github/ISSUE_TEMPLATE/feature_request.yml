name: Feature Request
description: Propose an idea or enhancement for Lumina Player
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for suggesting an improvement for Lumina Player!
  - type: textarea
    id: problem
    attributes:
      label: Problem or Motivation
      description: Is your feature request related to a problem or missing capability?
      placeholder: I'm missing the ability to...
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution / Desired Feature
      description: Describe the feature, user interface, or workflow you envision.
      placeholder: Introduce a feature that...
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any alternative solutions or features you considered.
  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Add any other context, mockup images, or references here.
